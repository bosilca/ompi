name: mpi4py

on:
  pull_request:
  workflow_dispatch:
    inputs:
      repository:
        description: 'mpi4py repository'
        default: 'mpi4py/mpi4py'
        required: false
        type: string
      ref:
        description: 'mpi4py branch/tag/SHA'
        default: 'master'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # DIAGNOSTIC BRANCH: only the leg that hangs.
          - name: ompi
            extra_configure: --disable-mpi-fortran
            mpicc: mpicc
    env:
      MPI4PY_TEST_SPAWN: true
    steps:
    - name: Configure hostname
      run:  echo 127.0.0.1 `hostname` | sudo tee -a /etc/hosts > /dev/null
      if:   ${{ runner.os == 'Linux' || runner.os == 'macOS' }}

    - name: Install depencencies
      run:  sudo apt-get install -y -q
              libnuma-dev
      if:   ${{ runner.os == 'Linux' }}

    - name: Allow ptrace and provide gstack
      run: |
        # --no-install-recommends keeps libc6-dbg out of it: the runner's
        # apt index is stale and that one 404s.
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends gdb
        sudo sysctl -w kernel.yama.ptrace_scope=0 || true
        printf '#!/bin/sh\nexec gdb -p "$1" -batch -ex "thread apply all bt" 2>/dev/null\n' \
          | sudo tee /usr/local/bin/gstack > /dev/null
        sudo chmod +x /usr/local/bin/gstack

    - name: Checkout Open MPI
      uses: actions/checkout@v6
      with:
       path: mpi-build
       submodules: recursive

    - name: Bootstrap Open MPI
      run:  AUTOMAKE_JOBS=$(nproc) ./autogen.pl
      working-directory: mpi-build

    - name: Configure Open MPI
      run:  ./configure
              --disable-dependency-tracking
              --enable-debug
              --enable-mem-debug
              --disable-sphinx
              ${{ matrix.extra_configure }}
              --disable-oshmem
              --disable-silent-rules
              --prefix=/opt/openmpi
              LDFLAGS=-Wl,-rpath,/opt/openmpi/lib
      working-directory: mpi-build

    - name: Build MPI
      run:  make -j $(nproc)
      working-directory: mpi-build

    - name: Install MPI
      run:  sudo make install
      working-directory: mpi-build

    - name: Add Open MPI to PATH
      run: echo /opt/openmpi/bin >> $GITHUB_PATH

    - name: Tweak MPI
      run:  |
        # Tweak MPI
        mca_params="$HOME/.openmpi/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo mpi_param_check = true >> "$mca_params"
        echo mpi_show_handle_leaks = true >> "$mca_params"
        mca_params="$HOME/.prte/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo rmaps_default_mapping_policy = :oversubscribe >> "$mca_params"
        mca_params="$HOME/.pmix/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo mca_base_suppress_deprecated_warning = true >> "$mca_params"

    - name: Show MPI
      run:  ompi_info

    - name: Use Python
      uses: actions/setup-python@v5
      with:
        python-version: 3
        architecture: x64

    - name: Install Python packages (build)
      run:  python -m pip install --upgrade
              setuptools pip wheel

    - name: Install Python packages (test)
      run:  python -m pip install --upgrade
              numpy cffi pyyaml

    - name: Checkout mpi4py
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository || 'mpi4py/mpi4py' }}
        ref: ${{ inputs.ref }}

    - name: Install mpi4py
      run:  python -m pip install .
      env:
        CFLAGS: "-O0"
        MPICC: ${{ matrix.mpicc }}

    # DIAGNOSTIC: the spawn tests alone, looped, with a watchdog that
    # dumps every surviving process and the ob1 queues a fragment can be
    # parked on.  The np=2 spawn block runs in under five seconds, so the
    # loop buys a hundred-odd samples of a hang that shows up in roughly
    # one job in three.
    - name: Spawn tests, looped, stacks on hang
      timeout-minutes: 20
      run: |
        set -u
        dump() {
          echo "########## WATCHDOG: hang detected, iteration $1 ##########"
          ps -eo pid,ppid,stat,etime,wchan:24,cmd | grep -E 'python|prte' | grep -v grep || true
          echo "########## sockets ##########"
          ss -tnp 2>/dev/null | head -60 || true
          for p in $(pgrep -f 'python|prterun' || true); do
            echo "########## pid $p ##########"
            sudo timeout 60 gdb -p "$p" -batch \
              -ex 'thread apply all bt' \
              -ex 'p mca_pml_ob1.non_existing_communicator_pending.opal_list_length' \
              -ex 'p mca_pml_ob1.modex_pending.opal_list_length' \
              -ex 'p mca_pml_ob1.send_pending.opal_list_length' \
              -ex 'p mca_pml_ob1.pckt_pending.opal_list_length' \
              -ex "p 'pml_ob1_recvfrag.c'::mca_pml_ob1_unseeded_procs" \
              -ex "p 'pml_ob1_progress.c'::mca_pml_ob1_progress_needed" \
              -ex 'p ompi_modex_all_ready_flag' \
              2>&1 | tail -120 || true
          done
        }
        deadline=$(( SECONDS + 17 * 60 ))
        i=0
        while [ "$SECONDS" -lt "$deadline" ]; do
          i=$(( i + 1 ))
          echo "===================== iteration $i ====================="
          mpiexec -n 2 python test/main.py -v -f -i spawn &
          mpipid=$!
          (
            for _ in $(seq 1 60); do
              sleep 1
              kill -0 $mpipid 2>/dev/null || exit 0
            done
            dump "$i"
            echo "########## WATCHDOG: killing iteration $i ##########"
            pkill -9 -f 'python|prterun' || true
          ) &
          wdpid=$!
          wait $mpipid; rc=$?
          kill $wdpid 2>/dev/null || true
          wait $wdpid 2>/dev/null || true
          echo "----- iteration $i rc=$rc -----"
          if [ "$rc" -ne 0 ]; then
            echo "STOPPING: iteration $i exited $rc"
            break
          fi
        done
